<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0maximum-scale=1.0, ">
  <title>确认订单 - Wholesale</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .address-card { background:var(--bg-card); margin:10px 12px; border-radius:var(--radius-md); padding:16px; display:flex; align-items:center; gap:12px; cursor:pointer; position:relative; }
    .address-card::after { content:'›'; position:absolute; right:16px; font-size:20px; color:var(--text-hint); }
    .address-icon { font-size:24px; }
    .address-info { flex:1; }
    .address-user { font-size:15px; font-weight:600; }
    .address-phone { font-size:14px; color:var(--text-secondary); margin-left:8px; }
    .address-detail { font-size:13px; color:var(--text-secondary); margin-top:4px; line-height:1.4; }
    .order-shop { background:var(--bg-card); margin:10px 12px; border-radius:var(--radius-md); overflow:hidden; }
    .order-shop-header { padding:12px 16px; border-bottom:1px solid var(--border-color); font-size:14px; font-weight:600; }
    .order-item { display:flex; gap:12px; padding:12px 16px; border-bottom:1px solid var(--border-color); }
    .order-item:last-child { border:none; }
    .order-item-img { width:72px; height:72px; border-radius:var(--radius-sm); flex-shrink:0; overflow:hidden; }
    .order-item-info { flex:1; min-width:0; }
    .order-item-title { font-size:13px; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .order-item-sku { font-size:12px; color:var(--text-hint); margin-top:4px; }
    .order-item-bottom { display:flex; justify-content:space-between; align-items:center; margin-top:6px; }
    .pay-section { background:var(--bg-card); margin:10px 12px; border-radius:var(--radius-md); padding:16px; }
    .pay-section .section-title { font-size:15px; font-weight:600; margin-bottom:12px; }
    .pay-method { display:flex; align-items:center; gap:12px; padding:12px 0; border-bottom:1px solid var(--border-color); cursor:pointer; }
    .pay-method:last-child { border:none; }
    .pay-method .pay-icon { font-size:24px; }
    .pay-method .pay-name { flex:1; font-size:14px; }
    .pay-method .pay-radio { width:20px; height:20px; border-radius:50%; border:2px solid var(--border-color); display:flex; align-items:center; justify-content:center; transition:var(--transition); }
    .pay-method .pay-radio.selected { border-color:var(--primary); }
    .pay-method .pay-radio.selected::after { content:''; width:10px; height:10px; border-radius:50%; background:var(--primary); }
    .summary-section { background:var(--bg-card); margin:10px 12px; border-radius:var(--radius-md); padding:16px; }
    .summary-row { display:flex; justify-content:space-between; padding:8px 0; font-size:14px; }
    .summary-row.total { border-top:1px solid var(--border-color); padding-top:12px; margin-top:4px; font-weight:700; font-size:16px; }
    .summary-row.total .value { color:var(--price-color); }
    .order-bottom { position:fixed; bottom:0; left:0; right:0; background:var(--bg-card); display:flex; align-items:center; justify-content:flex-end; padding:12px 16px calc(12px + var(--safe-bottom)); border-top:1px solid var(--border-color); z-index:100; }
    .order-bottom .order-total { margin-right:12px; }
    .order-bottom .order-total .label { font-size:13px; color:var(--text-secondary); }
    .order-bottom .order-total .price { font-size:20px; }
    .order-bottom .submit-btn { padding:12px 32px; background:var(--primary); color:#fff; border-radius:var(--radius-full); font-size:16px; font-weight:600; border:none; cursor:pointer; }
    .order-bottom .submit-btn:active { background:var(--primary-dark); }
    .remark-input { width:100%; border:none; background:var(--bg-page); padding:10px; border-radius:var(--radius-sm); font-size:13px; resize:none; }
  </style>
</head>
<body>
  <div class="page" style="padding-bottom:70px">
    <div class="header">
      <button class="back-btn" onclick="history.back()">‹</button>
      <span class="title">确认订单</span>
    </div>

    <div class="address-card" onclick="switchAddress()">
      <span class="address-icon">📍</span>
      <div class="address-info" id="address-info"></div>
    </div>

    <div id="order-items"></div>

    <div class="pay-section">
      <div class="section-title">💳 支付方式</div>
      <div class="pay-method" onclick="selectPay('alipay')"><span class="pay-icon">💙</span><span class="pay-name">支付宝</span><span class="pay-radio selected" id="pay-alipay"></span></div>
      <div class="pay-method" onclick="selectPay('wechat')"><span class="pay-icon">💚</span><span class="pay-name">微信支付</span><span class="pay-radio" id="pay-wechat"></span></div>
      <div class="pay-method" onclick="selectPay('bank')"><span class="pay-icon">🏦</span><span class="pay-name">对公转账</span><span class="pay-radio" id="pay-bank"></span></div>
    </div>

    <div class="pay-section">
      <div class="section-title">📝 订单备注</div>
      <textarea class="remark-input" rows="2" placeholder="选填：包装要求、交期要求等"></textarea>
    </div>

    <div class="summary-section" id="summary-section"></div>
  </div>

  <div class="order-bottom">
    <div class="order-total">
      <span class="label">实付：</span>
      <span class="price" id="final-price">¥0.00</span>
    </div>
    <button class="submit-btn" onclick="submitOrder()">提交订单</button>
  </div>

  <script src="js/app.js"></script>
  <script>
    let selectedAddress = MOCK.user.addresses ? MOCK.user.addresses[0] : { name: '张三', phone: '138****8888', address: '浙江省义乌市国际商贸城' };
    let selectedPay = 'alipay';
    const orderItems = Utils.storage.get('temp_order') || [];

    if (orderItems.length === 0) {
      const cartItems = Utils.storage.get('cart') || [];
      if (cartItems.length > 0) orderItems.push(...cartItems);
    }

    // 渲染地址（批发平台默认地址）
    function renderAddress() {
      document.getElementById('address-info').innerHTML = `
        <div><span class="address-user">${selectedAddress.name}</span><span class="address-phone">${selectedAddress.phone}</span></div>
        <div class="address-detail">${selectedAddress.address}</div>
      `;
    }
    renderAddress();

    function switchAddress() {
      Utils.showToast('切换收货地址');
    }

    // 渲染订单商品
    const grouped = {};
    orderItems.forEach(item => { if (!grouped[item.shop]) grouped[item.shop] = []; grouped[item.shop].push(item); });

    document.getElementById('order-items').innerHTML = Object.entries(grouped).map(([shop, items]) => `
      <div class="order-shop">
        <div class="order-shop-header">🏭 ${shop}</div>
        ${items.map(item => `
          <div class="order-item">
            <div class="order-item-img" style="background:${getProductColor(item.id)}">
              <img src="${productImageSVG(item.title, item.id)}" style="width:100%;height:100%;object-fit:cover">
            </div>
            <div class="order-item-info">
              <div class="order-item-title">${item.title}</div>
              <div class="order-item-sku">${item.sku || '默认规格'} × ${item.qty}件</div>
              <div class="order-item-bottom">
                <span class="price"><span class="symbol">¥</span>${Utils.formatPrice(item.price)}</span>
                <span style="font-size:13px;color:var(--text-hint)">小计 ¥${Utils.formatPrice(item.price * item.qty)}</span>
              </div>
            </div>
          </div>
        `).join('')}
      </div>
    `).join('');

    // 费用明细
    const subtotal = orderItems.reduce((s, i) => s + i.price * i.qty, 0);
    const freight = subtotal >= 5000 ? 0 : 200;
    const discount = Math.round(subtotal * 0.03 * 100) / 100;
    const total = subtotal + freight - discount;

    document.getElementById('summary-section').innerHTML = `
      <div class="summary-row"><span>商品金额</span><span>¥${Utils.formatPrice(subtotal)}</span></div>
      <div class="summary-row"><span>运费</span><span>${freight === 0 ? '免运费' : '¥' + Utils.formatPrice(freight)}</span></div>
      <div class="summary-row"><span>批发优惠</span><span style="color:var(--success)">-¥${Utils.formatPrice(discount)}</span></div>
      <div class="summary-row total"><span>实付金额</span><span class="value">¥${Utils.formatPrice(total)}</span></div>
    `;
    document.getElementById('final-price').innerHTML = `<span class="symbol">¥</span>${Utils.formatPrice(total)}`;

    function selectPay(method) {
      selectedPay = method;
      document.querySelectorAll('.pay-radio').forEach(r => r.classList.remove('selected'));
      document.getElementById('pay-' + method).classList.add('selected');
    }

    function submitOrder() {
      Utils.showToast('🎉 订单提交成功！');
      Utils.storage.set('cart', []);
      Utils.storage.remove('temp_order');
      setTimeout(() => {
        if (confirm('订单已提交，是否查看订单？')) location.href = 'user.html';
        else location.href = 'index.html';
      }, 1500);
    }
  </script>
</body>
</html>
