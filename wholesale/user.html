<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0maximum-scale=1.0, ">
  <title>我的 - Wholesale</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .user-header { background:linear-gradient(135deg, #FF6600, #FF8533); padding:30px 20px 40px; color:#fff; }
    .user-profile { display:flex; align-items:center; gap:14px; }
    .user-avatar { width:60px; height:60px; border-radius:50%; background:rgba(255,255,255,0.2); display:flex; align-items:center; justify-content:center; font-size:32px; border:2px solid rgba(255,255,255,0.5); }
    .user-name { font-size:18px; font-weight:600; }
    .user-level { display:inline-block; margin-top:4px; padding:2px 10px; border-radius:var(--radius-full); background:rgba(255,255,255,0.2); font-size:12px; }
    .user-company { font-size:12px; opacity:0.8; margin-top:2px; }
    .user-stats { display:flex; justify-content:space-around; margin-top:20px; text-align:center; }
    .user-stat .num { font-size:20px; font-weight:700; }
    .user-stat .label { font-size:12px; opacity:0.8; margin-top:2px; }
    .order-menu { background:var(--bg-card); margin:-20px 12px 10px; border-radius:var(--radius-md); padding:16px; position:relative; z-index:1; box-shadow:var(--shadow-md); }
    .order-menu-title { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; }
    .order-menu-title h3 { font-size:15px; font-weight:600; }
    .order-menu-title a { font-size:13px; color:var(--text-hint); }
    .order-grid { display:grid; grid-template-columns:repeat(4, 1fr); gap:4px; }
    .order-item-btn { display:flex; flex-direction:column; align-items:center; padding:10px 4px; cursor:pointer; position:relative; transition:var(--transition); }
    .order-item-btn:active { transform:scale(0.9); }
    .order-item-btn .order-icon { font-size:24px; margin-bottom:4px; }
    .order-item-btn .order-label { font-size:12px; color:var(--text-secondary); }
    .order-item-btn .order-badge { position:absolute; top:4px; right:20%; min-width:16px; height:16px; padding:0 4px; background:var(--primary); color:#fff; font-size:10px; border-radius:var(--radius-full); display:flex; align-items:center; justify-content:center; }
    .menu-section { background:var(--bg-card); margin:0 12px 10px; border-radius:var(--radius-md); overflow:hidden; }
    .menu-section-title { padding:14px 16px 8px; font-size:14px; font-weight:600; color:var(--text-secondary); }
    .menu-item { display:flex; align-items:center; gap:12px; padding:14px 16px; cursor:pointer; border-bottom:1px solid var(--border-color); transition:var(--transition); }
    .menu-item:last-child { border:none; }
    .menu-item:active { background:var(--bg-page); }
    .menu-item .menu-icon { font-size:20px; width:24px; text-align:center; }
    .menu-item .menu-text { flex:1; font-size:14px; }
    .menu-item .menu-arrow { color:var(--text-hint); font-size:16px; }
    .menu-item .menu-badge { background:var(--primary); color:#fff; padding:2px 8px; border-radius:var(--radius-full); font-size:11px; margin-right:8px; }
  </style>
</head>
<body>
  <div class="page">
    <div class="user-header">
      <div class="user-profile">
        <div class="user-avatar">🏭</div>
        <div>
          <div class="user-name" id="user-name">批发买家</div>
          <div class="user-company" id="user-company">XX贸易有限公司</div>
          <span class="user-level" id="user-level">金牌买家</span>
        </div>
      </div>
      <div class="user-stats">
        <div class="user-stat"><div class="num">12</div><div class="label">询价单</div></div>
        <div class="user-stat"><div class="num">38</div><div class="label">采购单</div></div>
        <div class="user-stat"><div class="num">56</div><div class="label">收藏</div></div>
        <div class="user-stat"><div class="num">8</div><div class="label">供应商</div></div>
      </div>
    </div>

    <div class="order-menu">
      <div class="order-menu-title">
        <h3>📋 我的采购单</h3>
        <a href="#">全部订单 ›</a>
      </div>
      <div class="order-grid">
        <div class="order-item-btn"><span class="order-icon">💰</span><span class="order-label">待付款</span><span class="order-badge">2</span></div>
        <div class="order-item-btn"><span class="order-icon">📦</span><span class="order-label">待发货</span><span class="order-badge">1</span></div>
        <div class="order-item-btn"><span class="order-icon">🚚</span><span class="order-label">待收货</span><span class="order-badge">3</span></div>
        <div class="order-item-btn"><span class="order-icon">⭐</span><span class="order-label">待评价</span><span class="order-badge">5</span></div>
      </div>
    </div>

    <div class="menu-section">
      <div class="menu-section-title">🔧 批发工具</div>
      <div class="menu-item"><span class="menu-icon">📋</span><span class="menu-text">询价管理</span><span class="menu-badge">3条</span><span class="menu-arrow">›</span></div>
      <div class="menu-item"><span class="menu-icon">🏭</span><span class="menu-text">我的供应商</span><span class="menu-arrow">›</span></div>
      <div class="menu-item"><span class="menu-icon">❤️</span><span class="menu-text">商品收藏</span><span class="menu-arrow">›</span></div>
      <div class="menu-item"><span class="menu-icon">📊</span><span class="menu-text">采购报表</span><span class="menu-arrow">›</span></div>
      <div class="menu-item"><span class="menu-icon">💬</span><span class="menu-text">消息通知</span><span class="menu-badge">5条未读</span><span class="menu-arrow">›</span></div>
    </div>

    <div class="menu-section">
      <div class="menu-section-title">⚙️ 设置</div>
      <div class="menu-item"><span class="menu-icon">👤</span><span class="menu-text">账户信息</span><span class="menu-arrow">›</span></div>
      <div class="menu-item"><span class="menu-icon">🏢</span><span class="menu-text">企业认证</span><span class="menu-arrow">›</span></div>
      <div class="menu-item"><span class="menu-icon">📍</span><span class="menu-text">收货地址</span><span class="menu-arrow">›</span></div>
      <div class="menu-item"><span class="menu-icon">📞</span><span class="menu-text">联系客服</span><span class="menu-arrow">›</span></div>
      <div class="menu-item" onclick="if(confirm('确定退出登录？'))location.href='login.html'">
        <span class="menu-icon">🚪</span><span class="menu-text" style="color:var(--danger)">退出登录</span>
      </div>
    </div>
    <div style="height:20px"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    const user = MOCK.user;
    document.getElementById('user-name').textContent = user.name;
    document.getElementById('user-company').textContent = user.company;
    document.getElementById('user-level').textContent = user.level;
  </script>
</body>
</html>
