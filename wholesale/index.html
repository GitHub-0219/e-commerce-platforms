<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wholesale - 批发采购平台</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .home-header {
      background: var(--primary);
      padding: 10px 16px;
      display: flex; align-items: center; gap: 12px;
      position: sticky; top: 0; z-index: 100;
    }
    .home-header .logo { font-size: 18px; font-weight: 700; color: #fff; white-space: nowrap; }
    .home-header .search-bar { background: rgba(255,255,255,0.9); }
    .banner-wrapper {
      position: relative; overflow: hidden;
      height: 160px; margin: 12px;
      border-radius: var(--radius-md);
    }
    .quick-nav {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 8px; padding: 16px;
      background: var(--bg-card); margin: 12px;
      border-radius: var(--radius-md);
    }
    .nav-item {
      display: flex; flex-direction: column; align-items: center;
      padding: 10px 4px; cursor: pointer;
      transition: var(--transition);
    }
    .nav-item:active { transform: scale(0.9); }
    .nav-item .nav-icon { font-size: 28px; margin-bottom: 4px; }
    .nav-item .nav-name { font-size: 11px; color: var(--text-secondary); }
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 16px 8px;
    }
    .section-header h2 { font-size: 17px; font-weight: 600; }
    .section-header a { font-size: 13px; color: var(--text-hint); }
    .hot-section {
      margin: 0 12px 12px;
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
    }
    .hot-card {
      background: var(--bg-card); border-radius: var(--radius-md);
      padding: 14px; cursor: pointer;
      transition: var(--transition);
    }
    .hot-card:active { transform: scale(0.97); }
    .hot-card .hot-title { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .hot-card .hot-desc { font-size: 12px; color: var(--text-hint); }
    .hot-card .hot-icon { font-size: 32px; margin-bottom: 8px; }
    .supplier-section { padding: 0 12px 12px; }
    .product-grid {
      display: grid; grid-template-columns: repeat(2, 1fr);
      gap: 10px; padding: 0 12px 12px;
    }
    .nav-tabs {
      display: flex; background: var(--bg-card);
      margin: 12px; border-radius: var(--radius-md);
      overflow: hidden;
    }
    .nav-tab {
      flex: 1; text-align: center; padding: 12px;
      font-size: 14px; color: var(--text-secondary);
      cursor: pointer; transition: var(--transition);
      position: relative;
    }
    .nav-tab.active { color: var(--primary); font-weight: 600; }
    .nav-tab.active::after {
      content: ''; position: absolute;
      bottom: 0; left: 30%; right: 30%;
      height: 2px; background: var(--primary); border-radius: 1px;
    }
    .category-grid {
      display: grid; grid-template-columns: repeat(5, 1fr);
      gap: 8px; padding: 16px;
      background: var(--bg-card); margin: 0 12px 12px;
      border-radius: var(--radius-md);
    }
    @media (min-width: 768px) {
      .category-grid, .quick-nav { grid-template-columns: repeat(10, 1fr); }
      .product-grid { grid-template-columns: repeat(3, 1fr); }
      .hot-section { grid-template-columns: repeat(4, 1fr); }
    }
    @media (min-width: 1200px) {
      .product-grid { grid-template-columns: repeat(4, 1fr); }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="home-header">
      <span class="logo">🏭 Wholesale</span>
      <div class="search-bar" onclick="location.href='sourcing.html'">
        <span>🔍</span>
        <input type="text" placeholder="搜索商品、供应商" readonly>
      </div>
    </header>

    <div class="banner-wrapper" id="banner"></div>

    <!-- 快捷入口 -->
    <div class="quick-nav">
      <a href="sourcing.html" class="nav-item"><span class="nav-icon">🔍</span><span class="nav-name">找货</span></a>
      <a href="sourcing.html?tab=factory" class="nav-item"><span class="nav-icon">🏭</span><span class="nav-name">工厂直供</span></a>
      <a href="sourcing.html?tab=new" class="nav-item"><span class="nav-icon">🆕</span><span class="nav-name">新品</span></a>
      <a href="inquiry.html" class="nav-item"><span class="nav-icon">📋</span><span class="nav-name">询价</span></a>
      <a href="sourcing.html?tab=hot" class="nav-item"><span class="nav-icon">🔥</span><span class="nav-name">热销</span></a>
    </div>

    <!-- 品类导航 -->
    <div class="category-grid" id="categories"></div>

    <!-- 热门专区 -->
    <div class="section-header"><h2>🔥 热门批发专区</h2><a href="sourcing.html">更多 ›</a></div>
    <div class="hot-section">
      <a href="sourcing.html?cat=1" class="hot-card">
        <div class="hot-icon">👕</div>
        <div class="hot-title">服装批发</div>
        <div class="hot-desc">128900+款 · 低至¥5</div>
      </a>
      <a href="sourcing.html?cat=4" class="hot-card">
        <div class="hot-icon">📱</div>
        <div class="hot-title">数码配件</div>
        <div class="hot-desc">89000+款 · 低至¥1</div>
      </a>
      <a href="sourcing.html?cat=5" class="hot-card">
        <div class="hot-icon">🏠</div>
        <div class="hot-title">家居日用</div>
        <div class="hot-desc">67800+款 · 低至¥2</div>
      </a>
      <a href="sourcing.html?cat=8" class="hot-card">
        <div class="hot-icon">🔧</div>
        <div class="hot-title">五金工具</div>
        <div class="hot-desc">78900+款 · 低至¥0.5</div>
      </a>
    </div>

    <!-- 优质供应商 -->
    <div class="section-header"><h2>🏭 优质供应商</h2><a href="sourcing.html">更多 ›</a></div>
    <div class="supplier-section" id="suppliers"></div>

    <!-- 推荐商品 -->
    <div class="section-header"><h2>💡 为你推荐</h2><a href="sourcing.html">更多 ›</a></div>
    <div class="product-grid" id="product-list"></div>
  </div>

  <script src="js/app.js"></script>
  <script>
    initBanner(document.getElementById('banner'), MOCK.banners);

    document.getElementById('categories').innerHTML = MOCK.categories.map(c =>
      `<a href="sourcing.html?cat=${c.id}" class="nav-item">
        <span class="nav-icon">${c.icon}</span>
        <span class="nav-name">${c.name}</span>
      </a>`
    ).join('');

    document.getElementById('suppliers').innerHTML = MOCK.suppliers.slice(0, 2).map(s => renderSupplierCard(s)).join('');
    renderProductGrid(document.getElementById('product-list'), MOCK.products);
  </script>
</body>
</html>
