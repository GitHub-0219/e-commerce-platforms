<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0maximum-scale=1.0, ">
  <title>搜索 - Shop Mall</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .search-header {
      background: var(--bg-card);
      padding: 8px 12px;
      display: flex; align-items: center; gap: 10px;
      position: sticky; top: 0; z-index: 100;
      border-bottom: 1px solid var(--border-color);
    }
    .search-header .search-bar { background: var(--bg-page); }
    .search-header .cancel { font-size: 14px; color: var(--primary); white-space: nowrap; padding: 8px; }
    .filter-bar {
      display: flex; align-items: center;
      background: var(--bg-card);
      padding: 0 12px;
      border-bottom: 1px solid var(--border-color);
      position: sticky; top: 50px; z-index: 99;
    }
    .filter-item {
      flex: 1; text-align: center;
      padding: 12px 0; font-size: 13px;
      color: var(--text-secondary);
      position: relative;
      cursor: pointer;
    }
    .filter-item.active { color: var(--primary); font-weight: 600; }
    .filter-item.active::after {
      content: ''; position: absolute;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 20px; height: 2px;
      background: var(--primary); border-radius: 1px;
    }
    .filter-item .arrow { font-size: 10px; margin-left: 2px; }
    .search-result-info {
      padding: 10px 16px; font-size: 12px; color: var(--text-hint);
    }
    .product-list {
      display: flex; flex-direction: column; gap: 10px;
      padding: 0 12px 12px;
    }
    .product-card-list {
      display: flex; background: var(--bg-card);
      border-radius: var(--radius-md); overflow: hidden;
    }
    .product-card-list .product-img {
      width: 120px; min-width: 120px; aspect-ratio: 1;
      display: flex; align-items: center; justify-content: center;
      font-size: 48px;
    }
    .product-card-list .product-info {
      flex: 1; padding: 12px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .product-card-list .product-title {
      font-size: 14px; line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .history-tags {
      display: flex; flex-wrap: wrap; gap: 8px;
      padding: 16px;
    }
    .history-tag {
      padding: 6px 14px;
      background: var(--bg-page);
      border-radius: var(--radius-full);
      font-size: 13px; color: var(--text-secondary);
      cursor: pointer;
    }
    .history-tag:active { background: var(--border-color); }
    .hot-search { padding: 16px; }
    .hot-search h3 { font-size: 15px; margin-bottom: 12px; }
    .hot-list { display: flex; flex-direction: column; }
    .hot-item {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 0; cursor: pointer;
    }
    .hot-item .rank {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; font-weight: 700;
      border-radius: 4px;
    }
    .hot-item:nth-child(-n+3) .rank { background: var(--primary); color: #fff; }
    .hot-item .hot-text { flex: 1; font-size: 14px; }
    .hot-item .hot-tag { font-size: 11px; padding: 2px 6px; border-radius: 3px; }
    .view-toggle {
      display: flex; gap: 8px; padding: 8px 12px;
      justify-content: flex-end;
    }
    .view-btn { padding: 4px 8px; font-size: 18px; opacity: 0.4; cursor: pointer; }
    .view-btn.active { opacity: 1; color: var(--primary); }
    @media (min-width: 768px) {
      .product-list-grid {
        display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px;
        padding: 0 12px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <!-- 搜索栏 -->
    <header class="search-header">
      <div class="search-bar">
        <span class="search-icon">🔍</span>
        <input type="text" id="search-input" placeholder="搜索商品、店铺" autofocus>
      </div>
      <span class="cancel" onclick="history.back()">取消</span>
    </header>

    <!-- 筛选栏 -->
    <div class="filter-bar" id="filter-bar" style="display:none">
      <div class="filter-item active" data-sort="default">综合</div>
      <div class="filter-item" data-sort="sales">销量</div>
      <div class="filter-item" data-sort="price-asc">价格<span class="arrow">↑</span></div>
      <div class="filter-item" data-sort="price-desc">价格<span class="arrow">↓</span></div>
      <div class="filter-item" data-sort="rating">评分</div>
    </div>

    <!-- 搜索前：历史+热搜 -->
    <div id="search-default">
      <div style="padding:16px;display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:14px;font-weight:600">搜索历史</span>
        <span style="font-size:12px;color:var(--text-hint);cursor:pointer" onclick="this.parentElement.nextElementSibling.innerHTML=''">清空</span>
      </div>
      <div class="history-tags">
        <span class="history-tag" onclick="doSearch(this.textContent)">连衣裙</span>
        <span class="history-tag" onclick="doSearch(this.textContent)">T恤</span>
        <span class="history-tag" onclick="doSearch(this.textContent)">运动鞋</span>
        <span class="history-tag" onclick="doSearch(this.textContent)">蓝牙耳机</span>
        <span class="history-tag" onclick="doSearch(this.textContent)">空气炸锅</span>
      </div>

      <div class="hot-search">
        <h3>🔥 热搜榜</h3>
        <div class="hot-list">
          <div class="hot-item" onclick="doSearch('618大促专区')"><span class="rank">1</span><span class="hot-text">618大促专区</span><span class="hot-tag" style="background:#FFF1F0;color:var(--primary)">HOT</span></div>
          <div class="hot-item" onclick="doSearch('碎花连衣裙')"><span class="rank">2</span><span class="hot-text">碎花连衣裙</span><span class="hot-tag" style="background:#FFF1F0;color:var(--primary)">HOT</span></div>
          <div class="hot-item" onclick="doSearch('防晒衣')"><span class="rank">3</span><span class="hot-text">防晒衣</span></div>
          <div class="hot-item" onclick="doSearch('螺蛳粉')"><span class="rank">4</span><span class="hot-text">螺蛳粉</span></div>
          <div class="hot-item" onclick="doSearch('智能手表')"><span class="rank">5</span><span class="hot-text">智能手表</span></div>
          <div class="hot-item" onclick="doSearch('空气炸锅')"><span class="rank">6</span><span class="hot-text">空气炸锅</span></div>
          <div class="hot-item" onclick="doSearch('婴儿用品')"><span class="rank">7</span><span class="hot-text">婴儿用品</span></div>
          <div class="hot-item" onclick="doSearch('机械键盘')"><span class="rank">8</span><span class="hot-text">机械键盘</span></div>
        </div>
      </div>
    </div>

    <!-- 搜索结果 -->
    <div id="search-results" style="display:none">
      <div class="search-result-info" id="result-info"></div>
      <div class="view-toggle">
        <span class="view-btn active" data-view="list" onclick="setView('list')">☰</span>
        <span class="view-btn" data-view="grid" onclick="setView('grid')">⊞</span>
      </div>
      <div class="product-list" id="result-list"></div>
      <div class="product-list-grid" id="result-grid" style="display:none"></div>
    </div>
  </div>

  <nav class="tab-bar" id="tab-bar"></nav>
  <script src="js/app.js"></script>
  <script>
    initTabBar(1);

    const searchInput = document.getElementById('search-input');
    let currentSort = 'default';
    let currentView = 'list';
    let results = [];

    function doSearch(keyword) {
      searchInput.value = keyword;
      document.getElementById('search-default').style.display = 'none';
      document.getElementById('search-results').style.display = 'block';
      document.getElementById('filter-bar').style.display = 'flex';

      // 模拟搜索
      results = MOCK.products.filter(p =>
        p.title.includes(keyword) || p.shop.includes(keyword) ||
        keyword.split('').some(ch => p.title.includes(ch))
      );
      if (results.length === 0) results = MOCK.products.slice(0, 8);

      document.getElementById('result-info').textContent = `找到 ${results.length} 件相关商品`;
      renderResults();
    }

    function renderResults() {
      let sorted = [...results];
      if (currentSort === 'sales') sorted.sort((a, b) => b.sales - a.sales);
      else if (currentSort === 'price-asc') sorted.sort((a, b) => a.price - b.price);
      else if (currentSort === 'price-desc') sorted.sort((a, b) => b.price - a.price);
      else if (currentSort === 'rating') sorted.sort((a, b) => b.rating - a.rating);

      const listView = document.getElementById('result-list');
      const gridView = document.getElementById('result-grid');

      listView.innerHTML = sorted.map(p => `
        <a href="product.html?id=${p.id}" class="product-card-list card">
          <div class="product-img" style="background:${getProductColor(p.id)}">
            <img src="${productImageSVG(p.title, p.id)}" style="width:100%;height:100%;object-fit:cover">
          </div>
          <div class="product-info">
            <div class="product-title">${p.title}</div>
            <div style="margin-top:6px">${p.tags.map(t => `<span class="tag" style="margin-right:4px">${t}</span>`).join('')}</div>
            <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px">
              <div>
                <span class="price"><span class="symbol">¥</span>${Utils.formatPrice(p.price)}</span>
                <span class="price original">¥${Utils.formatPrice(p.originalPrice)}</span>
              </div>
              <span style="font-size:11px;color:var(--text-hint)">${Utils.formatSales(p.sales)}人付款</span>
            </div>
          </div>
        </a>
      `).join('');

      renderProductGrid(gridView, sorted);
    }

    function setView(view) {
      currentView = view;
      document.getElementById('result-list').style.display = view === 'list' ? 'flex' : 'none';
      document.getElementById('result-grid').style.display = view === 'grid' ? 'grid' : 'none';
      document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
    }

    // 筛选点击
    document.getElementById('filter-bar').addEventListener('click', e => {
      const item = e.target.closest('.filter-item');
      if (!item) return;
      document.querySelectorAll('.filter-item').forEach(i => i.classList.remove('active'));
      item.classList.add('active');
      currentSort = item.dataset.sort;
      renderResults();
    });

    // 回车搜索
    searchInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && searchInput.value.trim()) doSearch(searchInput.value.trim());
    });

    // URL参数自动搜索
    const cat = Utils.getParam('cat');
    if (cat) {
      const c = MOCK.categories.find(c => c.id == cat);
      if (c) doSearch(c.name);
    }
  </script>
</body>
</html>
